media:
  input: images
  output: /archive/images
  rename: safe
  categories: [image]

content:
  - name: works
    label: "📁 작품 관리"
    type: file
    path: data/works.json
    format: json
    fields:
      - name: items
        label: "작품 목록 (맨 위 작품이 사이트에 가장 먼저 나와요)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: "작품 제목"
            type: string
            required: true
          - name: image
            label: "대표 이미지 (832x1216)"
            type: image
          - name: genre
            label: "장르 (작품 목록 필터에 표시 · 여러 개 선택 가능)"
            type: select
            options:
              multiple: true
              values:
                # sync:genres (자동 생성 — 직접 고치지 마세요)
                - value: "현대"
                  label: "현대"
                - value: "근미래"
                  label: "근미래"
                - value: "판타지"
                  label: "판타지"
                - value: "느와르"
                  label: "느와르"
                - value: "로맨스"
                  label: "로맨스"
                - value: "로판"
                  label: "로판"
                - value: "미스터리"
                  label: "미스터리"
                - value: "스릴러"
                  label: "스릴러"
                - value: "아포칼립스"
                  label: "아포칼립스"
                # end sync:genres
          - name: category
            label: "태그 (카드·상세에만 표시 · 쉼표로 여러 개)"
            type: string
          - name: description
            label: "작품 소개"
            type: text
          - name: releaseDate
            label: "출시일 (예: 2026.09.12)"
            type: string
          - name: platforms
            label: "플레이 플랫폼 (여러 개 추가 가능)"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: "플랫폼 이름 / 버튼 문구"
                type: string
                required: true
              - name: url
                label: "플랫폼 링크 (https://...)"
                type: string
                required: true
          - name: homepage
            label: "작품(캐릭터) 홈페이지 링크 (https://...)"
            type: string
            description: "넣으면 작품 상세 티켓에 홈페이지 버튼이 생겨요. 비워두면 안 보여요."
          - name: homepageLabel
            label: "홈페이지 버튼 문구 (비우면 '홈페이지')"
            type: string
          - name: detail
            label: "작품 상세 소개 (줄바꿈 가능)"
            type: text
  - name: genres
    label: "🏷 장르 목록"
    type: file
    path: data/genres.json
    format: json
    fields:
      - name: items
        label: "장르 목록 (여기에 추가하면 작품의 '장르' 드롭다운에 1분쯤 뒤 나타나요)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: "장르 이름"
            type: string
            required: true
  - name: characters
    label: "👤 캐릭터 관리"
    type: file
    path: data/characters.json
    format: json
    fields:
      - name: items
        label: "캐릭터 목록 (맨 위 캐릭터가 사이트에 가장 먼저 나와요)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: "캐릭터 이름"
            type: string
            required: true
          - name: category
            label: "소속 작품"
            type: select
            options:
              values:
                # sync:works (자동 생성 — 직접 고치지 마세요)
                - value: "용사님, 토벌은 다음에!"
                  label: "용사님, 토벌은 다음에!"
                - value: "FALSE HALO : 일그러진 영웅"
                  label: "FALSE HALO : 일그러진 영웅"
                - value: "피트 월 : NORTHSTAR"
                  label: "피트 월 : NORTHSTAR"
                - value: "11월에는 신광재를 조심하세요"
                  label: "11월에는 신광재를 조심하세요"
                # end sync:works
          - name: image
            label: "캐릭터 이미지 (832x1216)"
            type: image
          - name: description
            label: "캐릭터 소개"
            type: text
          - name: detail
            label: "캐릭터 상세 소개"
            type: text
          - name: role
            label: "소속 / 역할"
            type: string
          - name: personality
            label: "성격"
            type: text
          - name: appearance
            label: "외형"
            type: text
  - name: updates
    label: "📢 업데이트 기록"
    type: file
    path: data/updates.json
    format: json
    fields:
      - name: items
        label: "업데이트 목록 (맨 위가 최신)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: "업데이트 제목"
            type: string
            required: true
          - name: tag
            label: "태그 (제목 앞에 표시)"
            type: select
            options:
              values:
                - value: "신작"
                  label: "신작"
                - value: "업데이트"
                  label: "업데이트"
                - value: "수정"
                  label: "수정"
                - value: "공지"
                  label: "공지"
                - value: "이벤트"
                  label: "이벤트"
          - name: category
            label: "날짜 (YYYY-MM-DD)"
            type: string
          - name: description
            label: "업데이트 내용"
            type: text
          - name: image
            label: "이미지 (선택)"
            type: image
  - name: profile
    label: "💌 프로필"
    type: file
    path: data/profile.json
    format: json
    fields:
      - name: image
        label: "프로필 이미지"
        type: image
      - name: name
        label: "활동명"
        type: string
      - name: intro
        label: "소개"
        type: text
      - name: platform
        label: "활동 플랫폼"
        type: string
      - name: contact
        label: "연락처 / 링크"
        type: string
      - name: bio
        label: "자세한 자기소개"
        type: text
      - name: links
        label: "활동 페이지 링크 (https://...)"
        type: string
      - name: notice
        label: "안내 문구 (소개 페이지 NOTICE · 줄바꿈으로 여러 줄)"
        type: text
